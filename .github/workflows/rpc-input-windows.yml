
name: rpc-input-windows

on: [workflow_dispatch, push]

permissions:
  contents: read

jobs:
  windows-msvc:
    runs-on: windows-latest
    defaults:
      run:
        shell: 'bash'
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      OS: windows
      TARGET: msvc
    steps:
      # Before checkout, so the files keep LF line endings and the patch applies
      - name: Disable line ending translation
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Apply scripted-input patch
        run: |
          if [ ! -f azahar-rpc-input.patch ]; then
            echo "No azahar-rpc-input.patch in the repository root, building the tree as it is"
          elif git apply --reverse --check azahar-rpc-input.patch 2>/dev/null; then
            echo "Patch already applied"
          else
            git apply --verbose azahar-rpc-input.patch
          fi
          grep -q "SetInput = 100" src/core/rpc/packet.h || { echo "::error ::scripted input is missing from src/core/rpc/packet.h"; exit 1; }
      - name: Set up cache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-rpc-input-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-rpc-input-
      - name: Set up MSVC
        uses: azahar-emu/msvc-dev-cmd@v1
      - name: Install tools
        run: |
          choco install ccache ninja ptime wget
      - name: Checkout vcpkg for FFmpeg 7.1.2
        shell: pwsh
        run: |
          cd C:\vcpkg
          git checkout 5087d22fd76fe1844ca492866055dea3c34e7f52
          .\bootstrap-vcpkg.bat -disableMetrics
      - name: Build FFmpeg
        run: vcpkg install
          ffmpeg[avcodec,avfilter,avformat,swresample,aom,dav1d,mp3lame,opus,snappy,soxr,theora,vorbis,vpx,vulkan,x264,x265]:x64-windows-release
      - name: Install vulkan-sdk
        run: |
          wget https://sdk.lunarg.com/sdk/download/1.4.304.1/windows/VulkanSDK-1.4.304.1-Installer.exe -O D:/a/_temp/vulkan.exe
          D:/a/_temp/vulkan.exe --accept-licenses --default-answer --confirm-command install
      - name: Build
        run: ./.ci/win-msvc.sh
      - name: Add the Python client
        run: cp dist/scripting/AzaharRPC.py build/bundle/
      - name: Pack
        run: ./.ci/pack.sh
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: azahar-rpc-input-windows-msvc
          path: artifacts/

